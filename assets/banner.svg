<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140c2b"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a2347"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- app window mock -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="740" y="60" width="400" height="180" rx="12" fill="#0f0b1f" stroke="#3b2f63"/>
    <circle cx="764" cy="82" r="5" fill="#ef4444"/>
    <circle cx="782" cy="82" r="5" fill="#f59e0b"/>
    <circle cx="800" cy="82" r="5" fill="#22c55e"/>
    <rect x="740" y="98" width="400" height="1" fill="#3b2f63"/>
    <rect x="752" y="110" width="96" height="118" rx="6" fill="#1a1433"/>
    <text x="762" y="134" fill="#a78bfa" font-size="13">▸ Coding</text>
    <text x="762" y="158" fill="#94a3b8" font-size="13">▸ Writing</text>
    <text x="762" y="182" fill="#94a3b8" font-size="13">▸ Research</text>
    <text x="864" y="134" fill="#e2e8f0">Write a <tspan fill="#a78bfa">{{language}}</tspan></text>
    <text x="864" y="158" fill="#e2e8f0">function that</text>
    <text x="864" y="182" fill="#a78bfa">{{task}}<tspan fill="#e2e8f0">.</tspan></text>
    <rect x="864" y="198" width="88" height="24" rx="6" fill="url(#accent)"/>
    <text x="884" y="215" fill="#ffffff" font-size="13">Copy ⏎</text>
  </g>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="120" fill="#f8fafc" font-size="58" font-weight="800">AI Workbench</text>
    <rect x="66" y="140" width="200" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="190" fill="#ddd6fe" font-size="24">Your tools. Your data. Any model.</text>
    <text x="64" y="228" fill="#7c75a3" font-size="17">Local-first desktop apps for everyday work with LLMs.</text>
  </g>
</svg>
